name: pungmail-next
prefect-version: 3.8.1

build: []
push: []
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: C:/Users/ASUS/Desktop/poongmel-automization

deployments:
  - name: local-mail-processing
    version: issue-1
    description: Incremental Gmail collection and evidence extraction
    entrypoint: src/pungmail/workflows/mail_processing.py:mail_processing
    parameters:
      trigger_type: SCHEDULED
    work_pool:
      name: pungmail-local
      work_queue_name: default
      job_variables: {}
    schedules:
      # Safe deployment default. scripts/start.ps1 applies the .env toggle and interval.
      - interval: 60
        active: false

  - name: local-order-status-refresh
    version: issue-1
    description: Order sheet and inventory refresh workflow
    entrypoint: src/pungmail/workflows/order_status_refresh.py:order_status_refresh
    parameters:
      trigger_type: SCHEDULED
    work_pool:
      name: pungmail-local
      work_queue_name: default
      job_variables: {}
    schedules:
      - cron: "0 * * * *"
        timezone: Asia/Seoul
        active: true
