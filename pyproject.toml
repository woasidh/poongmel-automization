[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "pungmail-next"
version = "0.1.0"
description = "차세대 풍멜이 로컬 메일 수집 및 관찰 플랫폼"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.18.5",
  "fastapi==0.141.1",
  "google-api-python-client==2.198.0",
  "google-auth==2.56.2",
  "google-auth-oauthlib==1.4.0",
  "jinja2==3.1.6",
  "openai==2.52.0",
  "openpyxl==3.1.5",
  "pdfplumber==0.11.9",
  "pillow==12.3.0",
  "prefect==3.8.1",
  "pydantic-settings==2.14.2",
  "pymupdf==1.28.0",
  "pypdf==6.14.2",
  "pytesseract==0.3.13",
  "python-multipart==0.0.32",
  "requests==2.34.2",
  "sqlalchemy==2.0.51",
  "uvicorn==0.52.0",
  "xlrd==2.0.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
]

[project.scripts]
pungmail = "pungmail.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pungmail = ["api/templates/*.html", "api/static/*.css", "prompts/*.md", "prompts/categories/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
